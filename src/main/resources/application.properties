spring.application.name=spring-boot-lab8
server.port=8080

# База данных H2 в файле testdb/security в папке проекта
spring.datasource.url=jdbc:h2:file:./testdb/security;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Таблицы создаёт Hibernate по классам @Entity.
# update: при первом запуске таблицы создаются, при следующих – только дополняются, данные сохраняются
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

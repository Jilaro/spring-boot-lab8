<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="styles">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
</th:block>

<!-- Меню: набор пунктов зависит от того, вошёл ли пользователь и есть ли у него роль ADMIN -->
<nav th:fragment="menu" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Учёт студентов</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:if="${currentUser}" th:href="@{/list}">Студенты</a>
            <a class="nav-link" th:if="${isAdmin}" th:href="@{/users}">Пользователи</a>
        </div>
        <div class="navbar-nav align-items-center">
            <th:block th:unless="${currentUser}">
                <a class="nav-link" th:href="@{/login}">Вход</a>
                <a class="nav-link" th:href="@{/register}">Регистрация</a>
            </th:block>
            <th:block th:if="${currentUser}">
                <span class="navbar-text me-3">
                    <span th:text="${currentUser}"></span>
                    <span class="badge bg-warning text-dark ms-1" th:if="${isAdmin}">ADMIN</span>
                </span>
                <!-- Выход – POST-запрос с CSRF-токеном, который Thymeleaf добавит сам -->
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
            </th:block>
        </div>
    </div>
</nav>

<th:block th:fragment="table-scripts(tableId)">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script th:inline="javascript">
        $(function () {
            $('#' + /*[[${tableId}]]*/ 'table').DataTable({
                language: {url: 'https://cdn.datatables.net/plug-ins/1.13.8/i18n/ru.json'},
                columnDefs: [{orderable: false, targets: 'no-sort'}]
            });
        });
    </script>
</th:block>

</body>
</html>
